<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Karthik | Admin</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <nav class="navbar">

            <h2 class="logo">
                Karthik Admin
            </h2>

            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Portfolio
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main>

        <!-- ================= LOGIN ================= -->

        <section class="section">

            <h2>Admin Login</h2>

            <form id="login-form">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="login-status"></p>

        </section>


        <!-- ================= ADD PROJECT ================= -->

        <section
            class="section"
            id="project-section"
            style="display: none;"
        >

            <h2>Add New Project</h2>

            <form id="project-form">

                <input
                    type="text"
                    id="project-title"
                    placeholder="Project Title"
                    required
                >

                <textarea
                    id="project-description"
                    placeholder="Project Description"
                    required
                ></textarea>

                <input
                    type="text"
                    id="project-technologies"
                    placeholder="Technologies (comma separated)"
                    required
                >

                <input
                    type="url"
                    id="project-github"
                    placeholder="GitHub URL"
                >

                <input
                    type="url"
                    id="project-live"
                    placeholder="Live Demo URL"
                >

                <button type="submit">
                    Add Project
                </button>

            </form>

            <p id="project-status"></p>

        </section>
<hr>

<h2>Manage Projects</h2>

<div id="admin-projects-container"></div>
    </main>


    <footer>

        <p>
            © 2026 Karthik. All rights reserved.
        </p>

    </footer>


    <script src="admin.js"></script>

</body>

</html>
